name: Sync README to GitHub Pages

on:
  push:
    branches:
      - 'main'
      - 'beeqube'
    paths:
      - 'README.md'
      - '.github/workflows/sync-readme.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Setup Jekyll site with README
        run: |
          # Create a build directory
          mkdir -p _site
          
          # Create Jekyll config to enable markdown processing
          cat > _site/_config.yml << 'EOF'
          markdown: kramdown
          highlighter: rouge
          theme: minima
          plugins:
            - jekyll-feed
            - jekyll-sitemap
          EOF
          
          # Copy README as index.md with Jekyll front matter
          cat > _site/index.md << 'EOF'
          ---
          layout: default
          ---
          
          EOF
          cat README.md >> _site/index.md
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4